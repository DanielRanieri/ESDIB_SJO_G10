<!DOCTYPE html>
<html lang="en"> <!-- Lenguaje inglés, podría ser "es" si todo está en español -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Responsive -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- Iconos -->
  <link rel="stylesheet" href="style.css" /> <!-- CSS principal -->
  <title>Pets</title> <!-- Título de la página -->
  
  <style>
    /* Estilos internos para las tarjetas de animales */
    .pet-overlay-card { 
      display: flex; 
      height: 280px; /* altura fija */
      border-radius: 8px; 
      overflow: hidden; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      border: 1px solid #eee;
    }
    .pet-overlay-left { 
      width: 280px; 
      flex-shrink: 0; 
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border-right: 1px solid #eee;
      background: #f9f9f9;
    }
    .pet-overlay-left img { width: 100%; height: 100%; object-fit: cover; }
    .pet-overlay-left .no-photo { color: #ccc; font-size: 0.9em; }
    .pet-overlay-right { 
      flex-grow: 1; 
      padding: 20px; 
      overflow-y: auto; /* scroll vertical si hay mucho contenido */
      display: flex; 
      flex-direction: column; 
    }
    .pet-header-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start; 
      margin-bottom: 15px; 
      padding-bottom: 10px; 
      border-bottom: 1px solid #eee; 
    }
    .pet-header-row h3 { margin:0; font-size:1.4em; color:#333; }
    .pet-header-row h3 small { 
      display:block; 
      font-size:0.75rem; 
      color:#888; 
      font-weight:400; 
      margin-top:2px; 
      line-height:1.2; 
      font-style: normal; 
    }
    .pet-data-grid { 
      display:grid; 
      grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); 
      gap:12px; 
    }
    .pet-data-item { font-size:0.95em; }
    .pet-data-item strong { display:block; color:#555; font-size:0.85em; margin-bottom:2px; }
    .pet-actions { display:flex; gap:8px; }
  </style>
</head>

<body>

  <header>
    <nav class="nav">
      <!-- Botón menú y título -->
      <div class="nav-left">
        <i id="menu-btn" class="menu-btn-icon fa-solid fa-bars"></i>
        <a href="index.html" style="text-decoration:none; color:inherit;">
          <h1 class="titulo">ZOOPLANET</h1>
        </a>
      </div>

      <!-- Menú lateral oculto -->
      <div id="menu" class="menu-oculto">
        <div class="menu-top">
          <i class="fa-solid fa-xmark menu-close-btn" id="menu-close-btn"></i>
          <div class="menu-logo-circle">
            <img src="imagenes/paz.png" alt="Zoo Logo">
          </div>
        </div>

        <!-- Lista de secciones -->
        <ul class="menu-list">
          <!-- Cada sección tiene submenú -->
          <!-- ZOO -->
          <li> ... </li>
          <!-- ACUARIO -->
          <li> ... </li>
          <!-- TERRARIO -->
          <li> ... </li>
          <!-- INFO -->
          <li> ... </li>
          <!-- JUEGOS -->
          <li> ... </li>
        </ul>
      </div>

      <!-- Iconos de búsqueda y usuario -->
      <div class="iconos">
        <i class="fa-solid fa-magnifying-glass"></i>
        <a href="login.html" id="login-btn-header" style="color: white; text-decoration: none; margin: 0 10px;">
          <i class="fa-solid fa-user"></i>
        </a>
      </div>
    </nav>
  </header>

  <div class="main_container" id="main_content">
    <div class="title">UPLOAD ANIMAL</div>
    
    <!-- Formulario para subir animales -->
    <div class="formulario">
      <form id="alta_pet">
        <!-- Cada input está en un contenedor -->
        <div class="input_container">
          <label>Nombre científico</label>
          <input type="text" name="nombre_cientifico" ... >
        </div>
        <div class="input_container"> ... </div>
        <!-- Más campos: nombre, tamaño, peso, rasgos, clase, familia, dieta, esperanza, distribución, hábitat, extinción, grupo, imagen -->
        <div class="input_container_button">
          <button id="upload-button" type="submit"><label>SUBIR</label></button>
          <button id="cancel-edit" type="button" style="display:none; margin-left:8px;">Cancelar edición</button>
        </div>
      </form>

      <h2>Lista</h2>
      <ul id="pets-list"></ul> <!-- Aquí se inyectan los animales subidos -->
    </div>
  </div>

  <script src="app.js" defer></script> <!-- Lógica CRUD de animales -->
  <script src="menu.js"></script> <!-- Control del menú lateral -->

  <footer class="footer">
    <p>Zooplanet © 2025</p>
  </footer>
</body>
</html>
