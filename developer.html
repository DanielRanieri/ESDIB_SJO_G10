<!DOCTYPE html>
<html lang="es"> <!-- Documento en español -->

<head>
    <meta charset="UTF-8"> <!-- Codificación UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive -->
    <title>Zooplanet - Developer Dashboard</title> <!-- Título de la pestaña -->
    
    <!-- CSS base y estilos generales -->
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="CSS/styles.css">
    
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Contenedor principal de columnas */
        .dev-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Tres columnas iguales */
            gap: 20px;
            padding: 40px;
            max-width: 1400px; /* Ancho máximo */
            margin: 0 auto; /* Centrado horizontal */
        }

        /* Cada columna (Animales, Noticias, Usuarios) */
        .dev-column {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Sombra ligera */
            text-align: center;
        }

        /* Títulos dentro de columnas */
        .dev-column h2 {
            color: var(--verde-oscuro);
            border-bottom: 2px solid var(--verde-claro); /* Línea decorativa */
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Botones de acción */
        .dev-btn {
            display: block;
            width: 100%; /* Ocupa toda la columna */
            padding: 15px;
            margin-bottom: 15px;
            background: var(--verde-claro);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s; /* Transición para hover */
        }

        /* Efecto hover en botones */
        .dev-btn:hover {
            background: var(--verde-oscuro);
            transform: scale(1.02); /* Ligera ampliación */
        }
    </style>
</head>

<body>

    <header>
        <nav class="nav">
            <!-- Botón menú y título -->
            <div class="nav-left">
                <i id="menu-btn" class="menu-btn-icon fa-solid fa-bars"></i> <!-- Icono de menú -->
                <h1 class="titulo">ZOOPLANET - DEV MODE</h1>
            </div>

            <!-- Menú lateral oculto -->
            <div id="menu" class="menu-oculto">
                <div class="menu-top">
                    <i class="fa-solid fa-xmark menu-close-btn" id="menu-close-btn"></i> <!-- Cerrar menú -->
                    <div class="menu-logo-circle">
                        <img src="imagenes/paz.png" alt="Zoo Logo">
                    </div>
                </div>

                <!-- Lista de navegación con submenús -->
                <ul class="menu-list">
                    <!-- Secciones repetidas: ZOO, ACUARIO, TERRARIO, INFO, JUEGOS -->
                    <li> ... </li>
                </ul>
            </div>

            <!-- Icono para volver a Home -->
            <div class="iconos">
                <a href="index.html" style="color: white; font-size: 1.2rem; text-decoration: none;">
                    <i class="fa-solid fa-house"></i> Volver a Home
                </a>
            </div>
        </nav>
    </header>

    <!-- Contenedor principal del dashboard -->
    <main class="dev-container">
        <!-- Columna 1: Animales -->
        <div class="dev-column">
            <h2><i class="fa-solid fa-paw"></i> Animales</h2>
            <a href="formulario.html" class="dev-btn">Gestionar Animales (Formulario/Lista)</a>
        </div>

        <!-- Columna 2: Noticias -->
        <div class="dev-column">
            <h2><i class="fa-solid fa-newspaper"></i> Noticias</h2>
            <a href="admin_news.html" class="dev-btn">Gestión de Noticias (Form + Lista)</a>
        </div>

        <!-- Columna 3: Usuarios -->
        <div class="dev-column">
            <h2><i class="fa-solid fa-users"></i> Usuarios</h2>
            <a href="admin_users.html" class="dev-btn">Gestión de Usuarios (Form + Lista)</a>
        </div>
    </main>

    <!-- Footer con logo y copyright -->
    <footer class="footer">
        <img src="imagenes/logo.png" alt="Zooplanet Logo" style="height: 60px; margin-bottom: 10px;">
        <p>Zooplanet © 2025 - Developer Access</p>
    </footer>

    <!-- Script para controlar el menú lateral -->
    <script src="menu.js"></script>
</body>

</html>
